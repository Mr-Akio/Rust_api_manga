name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -f --max-time 15 "https://rust-api-manga.onrender.com/health" || echo "Ping request sent"
